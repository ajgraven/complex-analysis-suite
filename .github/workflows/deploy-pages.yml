name: Deploy to GitHub Pages

# Publishes the suite as a single combined GitHub Pages site: the launcher at the site root, with
# each app under a subpath (see the assemble step). Kept SEPARATE from ci.yml so the CI gate is
# untouched. All apps build with `base: "./"` (CLAUDE.md decision 11), so relative asset paths work
# from any Pages sub-path.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions the deploy-pages action requires on GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight Pages deploy at a time; don't cancel a publish mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Let corepack fetch the pinned pnpm without an interactive prompt (mirrors ci.yml).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS + corepack-provided pnpm, matching ci.yml and CLAUDE.md decision 10.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      # Same pnpm-store cache as ci.yml, and the same key — a publish right after a green CI run
      # restores the store CI just populated instead of refetching it.
      - name: Resolve the pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Gate the publish on the same quality checks CI enforces, so a commit that builds but fails
      # lint/typecheck/test never reaches the live site. Direct pushes to master bypass branch
      # protection's required checks, so the gate is enforced here too. (The CI `browser` job — the
      # real-WebGL2 numeric backstop — stays in ci.yml; it's not a publish blocker.)
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Builds packages + all apps via the root script. We publish launcher + CD + QD + Complex Function
      # Plotter + Riemann Map + Argument Principle + Faber Transform + 2D Electrostatics below; building
      # correspondences too is harmless and keeps parity with CI.
      - name: Build
        run: pnpm build

      - name: Assemble _site (launcher at root, apps under subpaths)
        run: |
          mkdir -p _site
          cp -r apps/launcher/dist/.         _site/
          cp -r apps/complex-dynamics/dist   _site/complex-dynamics
          cp -r apps/quadrature-domains/dist _site/quadrature-domains
          cp -r apps/complex-function-plotter/dist _site/complex-function-plotter
          cp -r apps/riemann-map/dist        _site/riemann-map
          cp -r apps/argument-principle/dist _site/argument-principle
          cp -r apps/faber-transform/dist    _site/faber-transform
          cp -r apps/2d-electrostatics/dist  _site/2d-electrostatics
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
