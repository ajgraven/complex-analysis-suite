name: CI

# The quality gate for the whole workspace — one of two workflows (see deploy-pages.yml, which
# publishes to Pages on push to master and runs its own lint/typecheck/test). The `build` job is
# the main gate:
# install → lint → typecheck → test → build (MIGRATION.md Phase 1 step 4; mirrors the local
# gate `pnpm lint && pnpm typecheck && pnpm test && pnpm build`). The parallel `browser` job
# executes the ACTUAL WebGL2 GLSL (the @cas/gpu dual-backend harness) in headless Chromium —
# the backstop for float32 GPU-only drift the CPU mirrors can't catch (Review P4).

# Triggers are deliberately NOT symmetric, to run the gate ONCE per change.
#
# `push` was previously `branches: ["**"]` alongside `pull_request`. Because a push ref
# (refs/heads/x) and a PR ref (refs/pull/N/merge) produce different concurrency groups, opening a PR
# from a branch in this repo ran the whole build + browser gate TWICE, in parallel, on identical
# code — and normalizing the group cannot fix it, since the two events legitimately describe
# different refs (a branch tip vs the merge commit).
#
# So: `pull_request` gates every change that can actually reach master (branch protection means a
# PR is the only route), and `push` is narrowed to master so a direct push — which bypasses branch
# protection — is still gated. The deliberate consequence is that pushing to a branch with no PR
# open runs nothing; opening the PR runs it.
on:
  push:
    branches: [master]
  pull_request:

# Avoid piling up redundant runs on rapid pushes to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Let corepack fetch the pinned pnpm without an interactive prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS is the target (CLAUDE.md decision 10 / .nvmrc); corepack provides the
      # pnpm version pinned in package.json's "packageManager" field.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      # Cache the pnpm content-addressable store so install is not a cold network fetch every run.
      # Done explicitly rather than via setup-node's `cache: pnpm`, because that resolves the store
      # path while restoring the toolchain — i.e. BEFORE `corepack enable` has put pnpm on PATH.
      # Reordering to satisfy it would mean enabling corepack against the runner's preinstalled Node
      # rather than the one setup-node selects; this way the proven step order is untouched.
      - name: Resolve the pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          # Keyed on the lockfile: any dependency change makes a new key, and `restore-keys` still
          # seeds from the previous store so only the changed packages are fetched.
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Runs the real WebGL2 GLSL (runGLSL over DUAL_BACKEND_CORPUS) in headless Chromium — the
  # numeric backstop the node/jsdom gate structurally can't be (Review P4). Kept SEPARATE from
  # `build` so it never slows the main gate; SwiftShader (software WebGL2) renders it, so the
  # test uses renderer-appropriate tolerances (arithmetic float32-exact, transcendentals ~1e-3).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      # Same pnpm-store cache as the `build` job (see the rationale there); the key is shared, so
      # whichever job finishes install first populates it for the other.
      - name: Resolve the pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Cache the browser binary across runs (keyed on the lockfile, which pins the playwright version).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Installs Chromium + its OS libraries (headless SwiftShader needs no display).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser dual-backend harness (real WebGL2 GLSL)
        run: pnpm test:browser
