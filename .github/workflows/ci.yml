name: CI

# The quality gate for the whole workspace — one of two workflows (see deploy-pages.yml, which
# publishes to Pages on push to master and runs its own lint/typecheck/test). The `build` job is
# the main gate:
# install → lint → typecheck → test → build (MIGRATION.md Phase 1 step 4; mirrors the local
# gate `pnpm lint && pnpm typecheck && pnpm test && pnpm build`). The parallel `browser` job
# executes the ACTUAL WebGL2 GLSL (the @cas/gpu dual-backend harness) in headless Chromium —
# the backstop for float32 GPU-only drift the CPU mirrors can't catch (Review P4).

on:
  push:
    branches: ["**"]
  pull_request:

# Avoid piling up redundant runs on rapid pushes to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Let corepack fetch the pinned pnpm without an interactive prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS is the target (CLAUDE.md decision 10 / .nvmrc); corepack provides the
      # pnpm version pinned in package.json's "packageManager" field.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Everything that needs a real WebGL2 context, in headless Chromium — the backstop the node/jsdom
  # gate structurally can't be. Two harnesses, both under `pnpm test:browser`:
  #
  #   · @cas/gpu — runGLSL over DUAL_BACKEND_CORPUS: executes the emitted GLSL and compares against
  #     the JS reference, catching float32 GPU-only drift (Review P4). SwiftShader (software WebGL2)
  #     renders it, so tolerances are renderer-appropriate (arithmetic float32-exact,
  #     transcendentals ~1e-3).
  #   · complex-dynamics — COMPILES AND LINKS the app's real shaders in single AND df64
  #     (cd-shader-uncompiled-07). Before this, no app shader was compiled anywhere in CI: the
  #     codegen tests assert on the emitted GLSL as a string, which cannot tell you the program
  #     builds. Verified the gap was real — a `cvec v = vec2(...)` in the generated template
  #     (valid as vec2, a type error as vec4) fails all four df64 compiles here while every string
  #     assertion in glslCodegen.test.ts still passes 9/9. CD is published, so that class of defect
  #     would reach users as a dead canvas.
  #
  # Kept SEPARATE from `build` so it never slows the main gate.
  # NOT covered: apps/correspondences' shaders are still never compiled (unpublished app).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Cache the browser binary across runs (keyed on the lockfile, which pins the playwright version).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Installs Chromium + its OS libraries (headless SwiftShader needs no display).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # @cas/gpu's dual-backend numeric harness, then CD's real-shader compile/link sweep.
      - name: Browser harnesses (real WebGL2 GLSL — execute + compile)
        run: pnpm test:browser
