# Continuous integration: run the headless test suite + ESLint on every push
# to main and every PR. Matches the local commands documented in
# CONTRIBUTING.md.
#
# Adding more checks:
#   * `npm run typecheck` once D7 (wider @ts-check coverage) lands.
#   * `npm run bench` once D5 ships — can be gated to a nightly cron rather
#     than every push.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Fail the build if a declared test dependency can't be loaded (dropped
      # devDep / broken install). Without this the suite would silently SKIP the
      # mathjs/jsdom/katex-gated sections and still go green (T3).
      - name: Verify test dependencies present
        run: node -e "require('mathjs'); require('jsdom'); require('katex'); console.log('test deps OK')"
      # Guard the experimental/advanced-features (Growth / DLA) isolation: that
      # research code must never reach main via an accidental merge (D6).
      - name: Guard experimental isolation
        run: |
          if [ -d app/growth ]; then
            echo "ERROR: app/growth/ (Growth/DLA experimental feature) must not exist on main."
            echo "It is isolated on origin/experimental/advanced-features — do not merge it without an explicit ask."
            exit 1
          fi
      # Fail fast if an app/ asset changed without refreshing the content-hash
      # cache version (run `npm run version:sync` to fix). Guards against stale
      # service-worker caches / stale ?v= page scripts shipping to users.
      - name: Check cache version
        run: npm run version:check
      - name: Run tests
        run: npm test
      - name: Run linter
        run: npm run lint
      # Dependency audit: informational / non-blocking. Surfaces known advisories
      # in the (dev-only) dependency tree in the CI log without failing the build
      # — advisories are often transitive and not always immediately actionable,
      # and the app ships zero runtime deps. Review the output and bump deps
      # deliberately (a flagged advisory is a prompt to act, not an auto-fail).
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit
      # Benchmark check: non-blocking. Reports >25% slowdowns as a warning
      # but doesn't fail the build — CI runners have variable load and the
      # threshold can produce false positives. Flip `continue-on-error: false`
      # once we have enough history to calibrate a tighter threshold.
      - name: Run benchmark check
        continue-on-error: true
        run: npm run bench:check
