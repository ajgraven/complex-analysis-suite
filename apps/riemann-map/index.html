<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riemann Map</title>
    <meta
      name="description"
      content="A research-grade Riemann-map and conformal-mapping studio: custom conformal maps, domain coloring, grids, invariants, and multiple construction methods. Part of the Complex Analysis Suite."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --panel: #141821;
        --panel-border: #262b36;
        --text: #e7e9ee;
        --muted: #99a1b3;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      #app { height: 100%; display: flex; flex-direction: column; }
      .topbar {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 0.55rem 0.9rem;
        border-bottom: 1px solid var(--panel-border);
        background: var(--panel);
        flex: 0 0 auto;
      }
      .topbar .brand { font-weight: 600; letter-spacing: -0.01em; }
      .topbar .maplabel { color: var(--accent); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .topbar .readout { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
      .stage { position: relative; flex: 1 1 auto; min-height: 0; }
      canvas.plane { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      canvas.plane:active { cursor: grabbing; }
      .note {
        position: absolute;
        left: 50%;
        top: 1rem;
        transform: translateX(-50%);
        max-width: 40rem;
        padding: 0.5rem 0.8rem;
        border-radius: 8px;
        background: rgba(176, 83, 58, 0.16);
        border: 1px solid rgba(176, 83, 58, 0.4);
        color: var(--text);
        display: none;
      }
      .note.visible { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <noscript>The Riemann Map studio requires JavaScript.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
