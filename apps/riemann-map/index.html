<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riemann Map</title>
    <meta
      name="description"
      content="A research-grade Riemann-map and conformal-mapping studio: custom conformal maps, domain coloring, grids, invariants, and multiple construction methods. Part of the Complex Analysis Suite."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --panel: #171a21;
        --panel-border: #262b36;
        --text: #e7e9ee;
        --muted: #99a1b3;
        --accent: #6ea8fe;
        --accent-soft: rgba(110, 168, 254, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 600px at 50% -10%, #1b2130 0%, var(--bg) 60%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .shell { max-width: 46rem; }
      .badge {
        display: inline-block;
        margin-bottom: 0.7rem;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 0.15rem 0.6rem;
      }
      h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 0.4rem; letter-spacing: -0.01em; }
      .tag { color: var(--muted); margin: 0 0 1rem; max-width: 40rem; }
      .status { color: var(--text); font-size: 0.95rem; margin: 0 0 1.25rem; }
      .probe { display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 1rem; margin: 0; font-size: 0.9rem; }
      .probe dt { color: var(--muted); }
      .probe dd { margin: 0; }
      code { background: rgba(255, 255, 255, 0.06); padding: 0.1rem 0.35rem; border-radius: 5px; color: var(--accent); }
      code.permalink { word-break: break-all; font-size: 0.82rem; }
    </style>
  </head>
  <body>
    <div id="app">
      <noscript>The Riemann Map studio requires JavaScript.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
