<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Correspondences — Mating explorer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --text: #e7e9ee;
        --muted: #99a1b3;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 600px at 50% -10%, #1b2130 0%, var(--bg) 60%);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 2rem;
      }
      main { max-width: 64rem; width: 100%; }
      h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 0.4rem; letter-spacing: -0.01em; }
      .tag { color: var(--muted); margin: 0 0 1.25rem; max-width: 44rem; }
      .status { color: var(--muted); font-size: 0.92rem; margin-top: 0.4rem; }
      a { text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mating/matingMain.ts"></script>
  </body>
</html>
