<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Complex Function Plotting Tool</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --panel: #161a21;
        --panel-2: #1b212b;
        --text: #e7e9ee;
        --muted: #99a1b3;
        --border: #262d38;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        height: 100%;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      aside {
        flex: 0 0 320px;
        max-width: 82vw;
        overflow-y: auto;
        padding: 16px;
        background: var(--panel);
        border-right: 1px solid var(--border);
      }
      h1 { font-size: 1rem; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.01em; }
      .sub { color: var(--muted); font-size: 0.76rem; margin: 0 0 16px; }
      .group { margin-bottom: 16px; }
      label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
      textarea, select {
        width: 100%; font: inherit; color: var(--text);
        background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px;
      }
      textarea { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; resize: vertical; min-height: 42px; }
      textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      #preview { min-height: 26px; margin-top: 8px; color: var(--text); overflow-x: auto; }
      #error { min-height: 18px; margin-top: 4px; color: #ff9b9b; font-size: 0.8rem; visibility: hidden; font-family: ui-monospace, Menlo, monospace; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button {
        font: inherit; cursor: pointer; color: var(--text);
        background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px;
      }
      button:hover { border-color: var(--accent); }
      .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0 8px; }
      label.check { display: flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: normal; font-size: 0.8rem; color: var(--text); margin: 0; }
      label.check input { width: auto; accent-color: var(--accent); }
      .subval { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: normal; }

      .legend { display: flex; gap: 14px; align-items: center; }
      .wheel-wrap { position: relative; flex: 0 0 auto; }
      .wheel-wrap span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.68rem; color: var(--muted); }
      .modbar-wrap { flex: 1 1 auto; }
      #modbar { display: block; width: 100%; border-radius: 4px; border: 1px solid var(--border); }
      .modbar-labels { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); margin-top: 3px; }

      dl.probe { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
      dl.probe dt { color: var(--muted); font-size: 0.78rem; }
      dl.probe dd { margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; overflow-x: auto; }

      .hint { color: var(--muted); font-size: 0.76rem; margin-top: 8px; }
      .stage { position: relative; flex: 1 1 auto; min-width: 0; }
      canvas#view, canvas#axes { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      canvas#view { touch-action: none; }
      canvas#axes { pointer-events: none; }
    </style>
  </head>
  <body>
    <aside>
      <h1>Complex Function Plotting Tool</h1>
      <p class="sub">Domain coloring of w = f(z) · Phase 1</p>

      <div class="group">
        <label for="expr">Function&nbsp; f(z)</label>
        <textarea id="expr" spellcheck="false" autocapitalize="off" autocomplete="off">z^2</textarea>
        <div id="preview"></div>
        <div id="error"></div>
      </div>

      <div class="group">
        <label for="preset">Preset</label>
        <select id="preset"></select>
      </div>

      <div class="group">
        <div class="row">
          <div>
            <label for="colormap">Colormap</label>
            <select id="colormap"></select>
          </div>
          <div>
            <label for="modulus">Modulus</label>
            <select id="modulus">
              <option value="0">Phase only</option>
              <option value="1">Linear</option>
              <option value="2">Rational</option>
              <option value="3">Logarithmic</option>
              <option value="4">Log-log</option>
            </select>
          </div>
        </div>
        <label for="cvd" style="margin-top: 10px">Colorblind preview</label>
        <select id="cvd">
          <option value="0">Off</option>
          <option value="1">Protanopia</option>
          <option value="2">Deuteranopia</option>
          <option value="3">Tritanopia</option>
        </select>
      </div>

      <div class="group">
        <label for="enhance">Enhancement</label>
        <select id="enhance">
          <option value="0">None (plain)</option>
          <option value="1">Modulus rings</option>
          <option value="2">Phase sectors</option>
          <option value="3">Conformal grid</option>
          <option value="4">Polar chessboard</option>
          <option value="5">Re/Im grid</option>
        </select>
        <div class="row" style="margin-top: 8px">
          <label class="check"><input type="checkbox" id="crisp" checked /> Crisp lines</label>
          <label class="check"><input type="checkbox" id="hueSign" /> Reverse hue</label>
        </div>
        <label for="sectors" style="margin-top: 8px">Density <span class="subval" id="sectorsVal"></span></label>
        <input type="range" id="sectors" min="2" max="24" step="1" value="12" />
        <label for="hueShift">Hue rotate</label>
        <input type="range" id="hueShift" min="0" max="360" step="1" value="0" />
      </div>

      <div class="group">
        <label>Legend</label>
        <div class="legend">
          <div class="wheel-wrap"><canvas id="wheel"></canvas><span>arg&nbsp;f</span></div>
          <div class="modbar-wrap">
            <canvas id="modbar"></canvas>
            <div class="modbar-labels"><span>|f| = 0</span><span>large</span></div>
          </div>
        </div>
      </div>

      <div class="group">
        <label>Cursor</label>
        <dl class="probe">
          <dt>z</dt><dd id="pz">&mdash;</dd>
          <dt>f(z)</dt><dd id="pfz">&mdash;</dd>
          <dt>|f|</dt><dd id="pabs">&mdash;</dd>
          <dt>arg&nbsp;f</dt><dd id="parg">&mdash;</dd>
        </dl>
      </div>

      <div class="group actions">
        <button id="home" type="button">Reset</button>
        <button id="savePng" type="button">Save PNG</button>
        <button id="copyLink" type="button">Copy link</button>
      </div>

      <p class="hint">Drag to pan · scroll to zoom · move the cursor to read f(z). Hue = arg f, brightness = |f|.</p>
    </aside>

    <main class="stage">
      <canvas id="view"></canvas>
      <canvas id="axes"></canvas>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
