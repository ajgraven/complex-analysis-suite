<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Complex Function Plotting Tool</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --text: #e7e9ee;
        --muted: #99a1b3;
        --border: #262b36;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); }
      header h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
      header p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.8rem; }
      header code { color: var(--accent); }
      .stage { position: relative; flex: 1 1 auto; min-height: 0; }
      canvas#view { display: block; width: 100%; height: 100%; }
      .status {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 0.4rem 0.75rem;
        font-size: 0.78rem;
        color: var(--muted);
        background: linear-gradient(to top, rgba(15, 17, 21, 0.85), rgba(15, 17, 21, 0));
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Complex Function Plotting Tool</h1>
      <p>Phase 0 · walking skeleton — a fixed compiled function rendered via <code>@cas/expr</code> &rarr; <code>@cas/gpu</code></p>
    </header>
    <div class="stage">
      <canvas id="view"></canvas>
      <p class="status" id="status">initializing&hellip;</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
