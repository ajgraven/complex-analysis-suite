<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contour Integration</title>
    <meta
      name="description"
      content="An interactive sandbox for contour integration and the residue theorem: draw a contour, watch the integral accumulate, and see whether the argument closes."
    />
    <!-- An inline data URI rather than a file: the icon is a closed contour with a pole inside it,
         which is what this app is, and a 300-byte SVG costs one fewer request than the `favicon.ico`
         the browser asks for on every load and got a 404 for — the only console error in every state
         the review visited. `base: "./"` (deployment) makes a relative asset path a hazard here;
         a data URI has no path to resolve. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%236ea8fe' stroke-width='2.5'/%3E%3Cpath d='M12 12l8 8M20 12l-8 8' stroke='%23f0f3f8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/ui/theme.css" />
    <link rel="stylesheet" href="./src/ui/shell.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
