<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="katex/katex.min.css"><script src="katex/katex.min.js"></script><link rel="stylesheet" href="layout.css"><script src="layout.js"></script><title>C</title><div class="suitebar"><b>Suite</b><span>Complex Dynamics</span><span>Quadrature Domains</span><span>Riemann Map</span><span>Argument Principle</span><span>Faber Transform</span><span>2D Electrostatics</span><span class="cur">Contour Integration</span></div><div class="appbar"><span class="title">Contour Integration</span><span class="seg"><span class="on">Explore</span><span>Worked example</span><span>Drill</span></span><span class="pick"><span class="tex" data-tex="\int_{-\infty}^{\infty}\frac{dx}{1+x^{4}}"></span><span style="color:var(--mut)">by a semicircle</span><span class="arrow">▾</span></span><span class="btn">Sandbox</span><span class="spacer"></span><span class="btn">Contrasts</span><span class="btn">Copy link</span><span class="btn">Save figure</span></div>
<div class="frame" style="grid-template-columns:1fr 380px;grid-template-rows:1fr 250px">
 <div class="stage" id="stage" style="grid-column:1;grid-row:1"></div>
 <div class="rail" style="grid-row:1/3" id="rail"></div>
 <div class="strip" id="drawer" style="grid-column:1;grid-row:2;grid-template-columns:220px 1fr;background:var(--bg2)"></div>
</div>
<script>
const {P,readout,T,tex}=window.MOCK;stage.innerHTML=readout();rail.innerHTML=P.verdict(false)+P.pieces()+P.poles()+P.share();
document.getElementById('drawer').innerHTML='<div style="padding:10px 14px;border-right:1px solid var(--line);font-size:12px"><div style="display:flex;justify-content:space-between;color:var(--mut);margin-bottom:6px"><b style="color:var(--fg)">Derivation</b><span>Accumulator ▸</span></div>'+
['1. The problem','2. Close the contour','3. Bound Γ_R','4. Let R → ∞','5. Enclosed poles','6. Residues','7. Conclude'].map((s,i)=>'<div style="padding:3px 6px;border-radius:5px;'+(i==2?'background:#26314a;color:var(--fg)':'color:var(--mut)')+'">'+s+'</div>').join('')+'</div>'+
'<div style="padding:12px 18px" class="step"><h3>3. Bound the integral over '+T(String.raw`\Gamma_R`)+'</h3>'+tex(String.raw`\Bigl|\int_{\Gamma_R} f(z)\,dz\Bigr| \le \pi R\cdot\max_{\Gamma_R}|f| \le \frac{\pi R}{R^{4}-1}`,true,'c')+'<div class="just">On '+T(String.raw`|z|=R`)+', '+T(String.raw`|1+z^{4}|\ge R^{4}-1`)+'; the arc has length '+T(String.raw`\pi R`)+'. Let R = <span class="scrub">4</span>: the bound is <b class="num">0.0493</b>, and → 0 as R → ∞ since it is '+T(String.raw`O(R^{-3})`)+'.</div><div class="why">Certified in exact ℚ; π enters only through a rational upper bracket.</div><div class="tools" style="margin-top:12px"><span class="btn">‹ Prev</span><span class="btn pri">Next ›</span><span class="btn">All steps</span></div></div>';
renderTex();
</script>
